[project]
name = "fhir-patient-data-transformer"
version = "0.1.0"
description = "A Python-based data transformation pipeline that converts patient records from CSV to FHIR-compliant JSON and YAML formats"
authors = [
    {name = "Chinomnso Chinedum",email = "chinomnsoc@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fhir.resources (>=14.0.0,<15.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "pyyaml (>=6.0,<7.0)",
    "pydantic (>=2.5.0,<3.0.0)",
    "click (>=8.1.0,<9.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "orjson (>=3.9.0,<4.0.0)"
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
